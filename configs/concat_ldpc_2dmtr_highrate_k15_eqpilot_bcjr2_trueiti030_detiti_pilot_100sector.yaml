# Pilot detector-ITI calibration for true ITI=0.30.
#
# This extends the true-ITI sweep beyond 0.25. The goal is to check whether the
# best detector assumed ITI keeps increasing with the physical cross-track tap
# or saturates around the 0.19--0.21 region observed at true ITI=0.25.
#
# Run on the Windows machine:
#   tdmr2d concat configs/concat_ldpc_2dmtr_highrate_k15_eqpilot_bcjr2_trueiti030_detiti_pilot_100sector.yaml
experiment:
  name: highrate_k15_eqpilot_bcjr2_trueiti030_detiti_pilot_100sector
  family: mtr2d_8x2
  seed: 319
  num_tracks: 40
  bits_per_track: 2048

code:
  type: mtr2d_8x2
  block_shape: [8, 2]
  K: 15
  down_mtr: 3
  max_checker_run: 1
  inner_encoder: blockwise
  boundary_down_mtr: 8
  boundary_max_checker_run: 8

channel:
  model: linear_2d_awgn
  c0: 1.0
  c_down_prev: 0.15
  c_down_next: 0.15
  c_cross_up: 0.30
  c_cross_down: 0.30
  snr_db: 16
  boundary: zero

detector:
  type: soft_awgn
  threshold: 0.0
  llr_clip: 30.0

metrics:
  target_ber: 1.0e-2

output:
  dir: outputs/runs

rate_plan:
  target_total_rate: 0.90
  sector_bits: 32768
  sector_count_target: 100
  exact_ldpc_rate: false
  check_codebook: true

ldpc:
  n: 1800
  dv: 3
  dc: 75
  construction_seed: 1
  method: minsum
  scale: 0.75
  max_iters: 30
  sector_bits: 32768
  sector_count_target: 100
  inner_demapper: hard_codebook
  turbo_iterations: 0
  turbo_llr_clip: 30.0
  turbo_damping: 0.0
  demapper_chunk: 64
  channel_detector: bcjr_2d_equalized
  equalizer_iterations: 2
  channel_llr_clip: 30.0
  detector_iti_coeffs: [0.18, 0.19, 0.20, 0.21, 0.22, 0.24, 0.27, 0.30]

sweep:
  snr_db: [14.0, 15.0, 16.0, 17.0, 18.0, 19.0]
  iti_coeffs: [0.30]
